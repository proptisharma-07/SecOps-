name: SecOps Pipeline

on:
  repository_dispatch:
    types:
      - application-push

jobs:

  # ============================================================
  # Stage 2: Trivy Dependency Scan
  # ============================================================

  trivy:
    name: Trivy Dependency Scan
    runs-on: ubuntu-latest

    steps:

      - name: Display Received Application Information
        run: |
          echo "SecOps Repo received Application trigger"
          echo "Application Repository: ${{ github.event.client_payload.repository }}"
          echo "Application Branch: ${{ github.event.client_payload.branch }}"
          echo "Application Commit SHA: ${{ github.event.client_payload.commit_sha }}"

      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application

      - name: Verify Checked Out Commit
        run: |
          echo "Application Source Successfully Checked Out"
          echo "Checked Out Commit SHA:"
          git -C application rev-parse HEAD

      # --------------------------------------------------------
      # Step 1: Run Trivy Dependency Scan
      # --------------------------------------------------------

      - name: Step 1 - Run Trivy Dependency Scan
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/app" \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            fs \
            /app \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --format json \
            --output /app/trivy-report.json \
            --exit-code 1

      # --------------------------------------------------------
      # Step 2: Check Trivy Report
      # --------------------------------------------------------

      - name: Step 2 - Check Trivy Report
        if: always()
        run: |
          if [ -f "application/trivy-report.json" ]; then
            echo "Trivy report generated successfully."
          else
            echo "Trivy report was not generated."
          fi

      # --------------------------------------------------------
      # Step 3: Show Vulnerability Summary
      # --------------------------------------------------------

      - name: Step 3 - Show Vulnerability Summary
        if: always()
        run: |
          echo "Trivy Dependency Findings:"
          echo "====================================="

          if [ -f "application/trivy-report.json" ]; then
            jq -r '
              .Results[]?
              | select(.Vulnerabilities != null)
              | .Vulnerabilities[]
              | "Package: \(.PkgName)\nInstalled: \(.InstalledVersion)\nFixed In: \(.FixedVersion // "N/A")\nSeverity: \(.Severity)\nCVE: \(.VulnerabilityID)\n---"
            ' application/trivy-report.json
          else
            echo "No report file found — either no vulnerable dependencies were detected or the scan did not run."
          fi

      # --------------------------------------------------------
      # Step 4: Upload Trivy Report
      # --------------------------------------------------------

      - name: Step 4 - Upload Trivy Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-dependency-report
          path: application/trivy-report.json
          if-no-files-found: warn


  # ============================================================
  # Stage 3: Docker Image Build + Image Scanning
  # ============================================================

  build-and-scan-image:
    name: Build & Scan Docker Image
    runs-on: ubuntu-latest
    needs: trivy

    steps:

      - name: Display Received Application Information
        run: |
          echo "SecOps Repo received Application trigger for image build & scan"
          echo "Application Repository: ${{ github.event.client_payload.repository }}"
          echo "Application Branch: ${{ github.event.client_payload.branch }}"
          echo "Application Commit SHA: ${{ github.event.client_payload.commit_sha }}"

      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application

      - name: Verify Checked Out Commit
        run: |
          echo "Application Source Successfully Checked Out"
          echo "Checked Out Commit SHA:"
          git -C application rev-parse HEAD

      # --------------------------------------------------------
      # Step 1: Build Docker Image
      # --------------------------------------------------------

      - name: Step 1 - Build Docker Image
        run: |
          docker build \
            -t hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            -f application/backend/Dockerfile \
            application/backend

      # --------------------------------------------------------
      # Step 2: Scan Docker Image
      # --------------------------------------------------------

      - name: Step 2 - Scan Docker Image for Vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            image \
            hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            --severity CRITICAL,HIGH \
            --format table \
            --exit-code 1

      # --------------------------------------------------------
      # Step 3: Generate JSON Image Report
      # --------------------------------------------------------

      - name: Step 3 - Generate JSON Report of Image Findings
        if: always()
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            -v "${GITHUB_WORKSPACE}:/output" \
            aquasec/trivy:latest \
            image \
            hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            --severity CRITICAL,HIGH \
            --format json \
            --output /output/trivy-image-report.json

      # --------------------------------------------------------
      # Step 4: Show Image Vulnerability Summary
      # --------------------------------------------------------

      - name: Step 4 - Show Image Vulnerability Summary
        if: always()
        run: |
          echo "Trivy Docker Image Findings:"
          echo "====================================="

          if [ -f "trivy-image-report.json" ]; then
            jq -r '
              .Results[]?
              | select(.Vulnerabilities != null)
              | .Vulnerabilities[]
              | "Package: \(.PkgName)\nInstalled: \(.InstalledVersion)\nFixed In: \(.FixedVersion // "N/A")\nSeverity: \(.Severity)\nCVE: \(.VulnerabilityID)\n---"
            ' trivy-image-report.json
          else
            echo "No image vulnerability report found."
          fi

      # --------------------------------------------------------
      # Step 5: Upload Image Scan Report
      # --------------------------------------------------------

      - name: Step 5 - Upload Image Scan Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.json
          if-no-files-found: warn